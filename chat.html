<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CampusTap — AI Chat</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Replaced with your exact dynamic config keys from app.js
    const firebaseConfig = { 
        apiKey: "AIzaSyBJ_tBuWyDtqPtS4nCG5V8jsiRdnoEiK7Q",
        authDomain: "campustap-b442c.firebaseapp.com",
        projectId: "campustap-b442c",
        storageBucket: "campustap-b442c.firebasestorage.app",
        messagingSenderId: "1047134881515",
        appId: "1:1047134881515:web:f574ca3c777130d12020ae",
        measurementId: "G-Q2H5PYEY0B"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Check if user is logged in
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      }
    });
  </script>
</head>
<body>
  <div class="bg-grid"></div>

  <nav>
    <span class="logo">🍽 CampusTap</span>
    <div class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="dining.html">Dining Halls</a>
      <a href="chat.html" class="active">AI Chat</a>
    </div>
  </nav>

  <main>
    <header class="dashboard-header">
        <p class="hall-label">Powered by AI</p>
        <h1>Campus Assistant</h1>
    </header>

    <div class="chat-container card">
      <div class="chat-messages" id="chat-box">
        <div class="message bot">Hello! Ask me anything about menus, swipe balances, or live dining hall crowding status metrics.</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="user-input" placeholder="What's for lunch at North Hall?" onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>

  <script>
    const BACKEND = 'https://campustap-production.up.railway.app';
    const menuData = {
      'North Dining Hall': [
        { name: 'Grilled Salmon', cal: 350, protein: '34g', carbs: '0g', fat: '22g' },
        { name: 'Quinoa Bowl', cal: 420, protein: '12g', carbs: '65g', fat: '8g' }
      ],
      'South Dining Hall': [
        { name: 'Beef Tacos', cal: 510, protein: '28g', carbs: '40g', fat: '25g' },
        { name: 'Garden Salad', cal: 150, protein: '3g', carbs: '12g', fat: '10g' }
      ],
      'The Commons': [
        { name: 'Margherita Pizza', cal: 280, protein: '12g', carbs: '35g', fat: '10g' },
        { name: 'Classic Burger', cal: 650, protein: '30g', carbs: '45g', fat: '38g' }
      ]
    };
    
    let studentData = null;
    let diningHalls = [];
    
    async function loadContext() {
      try {
        const { getAuth } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
        const auth = getAuth();
        const user = auth.currentUser;
    
        if (user) {
          const res = await fetch(`${BACKEND}/student-data?email=${encodeURIComponent(user.email)}`);
          if (res.ok) studentData = await res.json();
        }
      } catch (e) {
        console.warn('Could not load student data for chat context:', e);
      }
    
      try {
        const res = await fetch(`${BACKEND}/dining-halls`);
        if (res.ok) diningHalls = await res.json();
      } catch (e) {
        console.warn('Could not load dining halls for chat context:', e);
      }
    }
    
    loadContext();
    
    async function sendMessage() {
      const inputEl = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const messageText = inputEl.value.trim();
      if (!messageText) return;
    
      chatBox.innerHTML += `<div class="message user">${messageText}</div>`;
      inputEl.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
      const context = {
        student: studentData ? {
          name: studentData.name,
          swipes: studentData.swipes,
          dining_dollars: studentData.dining_dollars
        } : null,
        dining_halls: diningHalls.map(h => ({
          name: h.name,
          location: h.location,
          is_open: h.is_open,
          crowdedness: h.crowdedness
        })),
        menus: menuData
      };
    
      try {
        const res = await fetch(`${BACKEND}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: messageText, context })
        });
        const data = await res.json();
        chatBox.innerHTML += `<div class="message bot">${data.reply || data.error}</div>`;
      } catch (err) {
        chatBox.innerHTML += `<div class="message bot">Error: Unable to connect to backend.</div>`;
      }
    
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();
    }
  </script>
</body>
</html>
